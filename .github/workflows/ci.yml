name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: districore_test
          POSTGRES_USER: districore
          POSTGRES_PASSWORD: districore
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]

    env:
      DATABASE_URL: postgres://districore:districore@localhost:5432/districore_test
      DISTRICORE_SECRET_KEY: ci-only-not-a-real-secret-0000000000000000
      DISTRICORE_ALLOWED_HOSTS: localhost
      DJANGO_SETTINGS_MODULE: config.settings.test
      # import-linter resolves packages statically; they must be on the path.
      PYTHONPATH: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Secret scan FIRST. A leaked secret is the only unrecoverable failure here.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The third install site. It read the specifiers and never opened the lock, so CI
      # could pass having installed different packages from the gate — which is worse than
      # no CI. `--frozen` refuses to re-resolve, so a stale lock fails here too (TD-21).
      - name: Install
        run: |
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # 2-3. Fast static checks
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy backend/

      # 4. Architecture contracts — N-01 and N-02, mechanically
      - name: Import contracts
        run: lint-imports

      # 5. Structural-enabler gate (ADR-0004)
      - name: Stock structural columns present
        run: python ops/check_structural_columns.py

      # 6. Migrations complete
      - name: No missing migrations
        run: python backend/manage.py makemigrations --check --dry-run

      # 7-8. Tests
      - name: Tests
        run: pytest --cov --cov-report=xml --cov-fail-under=80

      - name: Adversarial suite
        run: pytest -m adversarial -v

      # 9. Image builds
      - name: Build image
        run: docker build -f docker/Dockerfile -t districore:ci .

      # 10. Dependency vulnerabilities — NFR-SEC-009. **BLOCKING** (TD-35 closed).
      #
      # This step carried `|| true` from P0 until M10. `02` NFR-SEC-009 says a finding
      # "MUST block release", and a step that cannot fail blocks nothing — the same shape
      # `mypy` had for six milestones with 24 real errors behind it (TD-2).
      #
      # **Blocks on any known vulnerability, not only on a graded "critical" one.**
      # `pip-audit` reports no severity, so there is no severity to branch on; blocking on
      # every finding is strictly stronger than the requirement and fails closed. It is not
      # a reinterpretation — a rule that admits everything the requirement admits, and less,
      # satisfies it.
      #
      # `--strict` additionally fails when a dependency cannot be audited at all, so a
      # package that silently drops out of the scan is a failure rather than a pass.
      #
      # **One exception, and it is the only one** — M10.5, `docs/M10_Security_Review.md` §3.2.
      # CVE-2026-49452 / PYSEC-2026-3412 / GHSA-jhhc-3hcp-qhm5 are three identifiers for a
      # single WeasyPrint CSS-injection issue with **no published fix in any version**. It is
      # reachable only through `presentational_hints=True`; WeasyPrint's own source guards the
      # whole vulnerable block with `if not presentational_hints: continue`, the default is
      # `False`, and this application's single call site does not pass it.
      #
      # An `--ignore-vuln` with no record is how a finding disappears. This one has a decision
      # with a date and a review date in §3.2, and two tests hold it:
      # `test_the_dependency_audit_cannot_be_silenced` fails if an ID here is not documented
      # there, and `test_weasyprint_presentational_hints_are_never_enabled` fails the moment
      # the code property the exception rests on stops being true.
      - name: Dependency audit
        run: >-
          pip-audit --strict
          --ignore-vuln CVE-2026-49452
          --ignore-vuln PYSEC-2026-3412
          --ignore-vuln GHSA-jhhc-3hcp-qhm5
