name: districore
description: DistriCore field application — one binary, three roles (DV-4).
publish_to: none
version: 0.1.0

environment:
  # A floor, not a pin. The pin is `.flutter-version` plus `pubspec.lock`;
  # a range here would let CI resolve a different SDK from the developer's.
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  # DI and state (M8 §6). Chosen because the app's hard state is the outbox and its
  # truth lives in SQLite — the state layer observes it rather than owning it.
  flutter_riverpod: ^2.5.0
  # Declarative routing with one redirect guard (M8 §4).
  go_router: ^14.0.0
  # HTTP client (M8 §7.5 ADR). Interceptors are the reason: C-7's refresh-once, C-10's
  # device_id and the problem+json mapping are cross-cutting, and hand-rolling them over
  # `http` means repeating three rules at every call site.
  dio: ^5.7.0
  # P-3 / `05` AD-02. Dart has no built-in exact decimal; `jsonDecode` yields `double` for
  # any unquoted number, and one careless cast reintroduces the defect `core.fields`
  # protects on the server. A floor, not a pin — `pubspec.lock` is the pin.
  decimal: ^2.3.0
  # M8 §5.6 ADR — the local database. Chosen for atomic multi-row commits, ordered reads
  # and migration on a device that cannot be wiped (task 3).
  drift: ^2.18.0
  # `data/outbox/storage_failure.dart` imports `package:sqlite3/common.dart` to read the
  # engine's result codes (D-C3). An imported package must be a declared dependency, not a
  # transitive one inherited from drift: relying on drift's dependency means a drift upgrade
  # could drop sqlite3 from the graph and break an import that has nothing to do with drift.
  sqlite3: ^3.5.1
  # M8 §8.2 — the refresh token and device id live in the platform keystore, never in
  # shared preferences. Wrapped behind `data/identity/secure_storage.dart` so the token
  # store is unit-testable without a device (task 4 M1).
  flutter_secure_storage: ^11.0.0
  path: ^1.9.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The device gates. A unit test's database is in memory or a temp path and holds no key, so
  # the claims that only hold for the real file — `journal_mode = WAL` and `synchronous = FULL`
  # in `data/db/connection.dart`, and encryption at rest — are unreachable without a device.
  # `integration_test/` is where they are reached. `M8_Design_Review` §14.11 assigns kill and
  # real storage exhaustion there (`00` §19.2, still open); `encryption_at_rest_test.dart`
  # discharges NFR-SEC-008 there (D-M9-8, closed on a Pixel 8a API 34 emulator, android-x64).
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Drift is a code-generation package: `drift_dev` writes the `.g.dart` part files without
  # which the schema does not compile. Run via `make mobile-codegen`.
  drift_dev: ^2.18.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

# **Where encryption comes from — this block, and nothing else** (FR-SYN-016, NFR-SEC-008).
#
# `package:sqlite3` 3.x selects its native library through Dart build hooks, and the default
# is upstream SQLite — which has no codec, so `PRAGMA key` is an unrecognised pragma and is
# **silently ignored**. There is no dependency anywhere in this file that changes that, and
# no dependency could: `source:` below is the only mechanism.
#
# **This used to be a dependency, and that is why it is worth spelling out.** Until
# 2026-08-25 the block above declared `sqlcipher_flutter_libs`, annotated as though it
# satisfied the requirement. It never did. Its `openCipherOnAndroid()` feeds
# `open.overrideFor`, an API `sqlite3` 3.x removed, so nothing could call it — the package
# shipped 13.8 MiB of `libsqlcipher.so` into every APK that was never loaded while the outbox
# was written in cleartext, and no test in the repository could see it. A dependency that
# *looks* like a satisfied requirement is worse than an absent one, so it is gone.
#
# **Why SQLite3MultipleCiphers and not SQLCipher.** The M8 §5.6 ADR names SQLCipher, and
# `source: sqlcipher` was tried first. Its Linux prebuilt was rebuilt in `sqlite3` 3.5.2 and
# requires GLIBC_2.38; `docker/flutter.Dockerfile` is `debian:bookworm-slim` (2.36), so 151
# of 317 tests died in `dlopen` before reaching any assertion. `source` is a single global
# value — per-OS selection is unimplemented upstream (simolus3/sqlite3.dart#346, open) — so
# one library must serve both the device and the verification container. `sqlite3mc` does,
# which additionally means CI now runs the *same* engine the device runs and can execute the
# cipher guard. The §5.6 amendment recording this is pending.
#
# There is no Dart API for this choice; this block is the only mechanism. Removing it returns
# the project to plaintext SQLite, which is why two things stand behind it:
# `data/db/connection.dart` refuses to open the database, and
# `test_mobile_boundary.py::test_the_build_hook_selects_an_encrypting_sqlite` fails the gate.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
