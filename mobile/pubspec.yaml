name: districore
description: DistriCore field application — one binary, three roles (DV-4).
publish_to: none
version: 0.1.0

environment:
  # A floor, not a pin. The pin is `.flutter-version` plus `pubspec.lock`;
  # a range here would let CI resolve a different SDK from the developer's.
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  # DI and state (M8 §6). Chosen because the app's hard state is the outbox and its
  # truth lives in SQLite — the state layer observes it rather than owning it.
  flutter_riverpod: ^2.5.0
  # Declarative routing with one redirect guard (M8 §4).
  go_router: ^14.0.0
  # HTTP client (M8 §7.5 ADR). Interceptors are the reason: C-7's refresh-once, C-10's
  # device_id and the problem+json mapping are cross-cutting, and hand-rolling them over
  # `http` means repeating three rules at every call site.
  dio: ^5.7.0
  # P-3 / `05` AD-02. Dart has no built-in exact decimal; `jsonDecode` yields `double` for
  # any unquoted number, and one careless cast reintroduces the defect `core.fields`
  # protects on the server. A floor, not a pin — `pubspec.lock` is the pin.
  decimal: ^2.3.0
  # M8 §5.6 ADR — the local database. Chosen for atomic multi-row commits, ordered reads
  # and migration on a device that cannot be wiped (task 3).
  drift: ^2.18.0
  # The §5.6 ADR is Drift **with SQLCipher**: FR-SYN-016 and NFR-SEC-008 require the outbox
  # encrypted at rest. The key comes from the keystore at task 4; task 3 opens the database
  # through an injected key provider so the seam exists before the secret does.
  sqlcipher_flutter_libs: ^0.6.0
  # `data/outbox/storage_failure.dart` imports `package:sqlite3/common.dart` to read the
  # engine's result codes (D-C3). An imported package must be a declared dependency, not a
  # transitive one inherited from drift: relying on drift's dependency means a drift upgrade
  # could drop sqlite3 from the graph and break an import that has nothing to do with drift.
  sqlite3: ^3.5.1
  # M8 §8.2 — the refresh token and device id live in the platform keystore, never in
  # shared preferences. Wrapped behind `data/identity/secure_storage.dart` so the token
  # store is unit-testable without a device (task 4 M1).
  flutter_secure_storage: ^11.0.0
  path: ^1.9.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Drift is a code-generation package: `drift_dev` writes the `.g.dart` part files without
  # which the schema does not compile. Run via `make mobile-codegen`.
  drift_dev: ^2.18.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
