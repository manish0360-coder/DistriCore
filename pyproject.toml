[project]
name = "districore"
version = "0.1.0"
description = "Sales & Distribution Management Platform"
requires-python = ">=3.12,<3.13"

# Every dependency below is justified in 00_Engineering_Foundation.md §3.
# Adding one without an ADR is a review failure.
dependencies = [
    "django>=5.2.17,<5.3",                  # framework (ADR-002); M10.5 floor: 7 CVEs
    "djangorestframework>=3.17.2,<3.18",    # API layer; M10.5 floor: CVE-2026-73228/73229
    "djangorestframework-simplejwt>=5.3,<6", # mobile auth (05 §7.1)
    "django-environ>=0.11,<0.13",           # typed env parsing (FD-11)
    "psycopg[binary]>=3.2,<4",              # PostgreSQL driver
    "argon2-cffi>=23.1",                    # password hashing (FR-IAM-002)
    "django-axes>=6.5,<7",                  # login rate limiting (FR-IAM-004)
    "gunicorn>=22.0,<24",                   # WSGI server
    "whitenoise>=6.7,<7",                   # static files from the app container
    "httpx>=0.27,<0.29",                    # SMS provider HTTP (kept provider-agnostic)
    "weasyprint>=68,<69",                   # invoice PDF (00 §7, 03 §7); M10.5 floor: SSRF
]

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# The verification toolchain is PINNED, not bounded (FD-03, TD-1).
#
# Evidence, not precaution. Two `make verify` runs from the same commit:
#
#   run 1  pytest 9.1.1 · pytest-django 4.12.0 · pytest-cov 7.1.0 · Django 5.1.15
#          -> 447 collected, 403 passed
#   run 2  pytest 9.1.1 · pytest-django 4.13.0 · pytest-cov 7.1.0 · Django 5.1.15
#          -> Django's TestCase failed to initialise; 414 cascading errors
#
# One variable differed, and the crash was inside the package that moved:
# pytest_django/fixtures.py::_django_db_helper, on the `_pre_setup_ran_eagerly`
# attribute 4.13.0 added when it reworked that fixture.
#
# Stage 1 builds --no-cache and installs with `uv pip install -r pyproject.toml`,
# which resolves from PyPI and does not read a lockfile. Open-ended specifiers
# therefore let the gate's own toolchain change underneath unchanged source.
# N-12 makes the Docker run the sole authority on correctness; an authority that
# answers differently on consecutive days is not one.
#
# Moving any `==` below is a deliberate act with a verify run attached.
# ---------------------------------------------------------------------------
dev = [
    "pytest==9.1.1",                        # defines the gate's semantics
    "pytest-django==4.12.0",                # THE regression; 4.13.0 breaks _django_db_helper
    "pytest-cov==7.1.0",                    # owns the stage 7 coverage number
    "factory-boy>=3.3,<4",
    "ruff>=0.6,<0.15",                      # owns stage 4; a new rule is a new failure
    "mypy>=1.11,<2",
    "django-stubs[compatible-mypy]>=5.0,<6",
    "import-linter>=2.0,<3",                # owns stage 5
    "pre-commit>=3.8,<5",
    "pip-audit>=2.7,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# uv — resolution and the lockfile (FD-04, TD-21)
# ---------------------------------------------------------------------------
[tool.uv]
# **DistriCore's repository root is an application, not a distribution.**
#
# Nothing has ever built, installed or imported a `districore` package — every
# `districore.*` name in the codebase is a logger. The application is deployed by copying
# `backend/` into the image and running it with a WORKDIR. This line records what has been
# true since M0 rather than changing anything.
#
# It is also what lets the dependency layer work at all. `docker/Dockerfile` installs
# dependencies BEFORE copying code (D-3: "code changes hourly, dependencies monthly"), so a
# packaged root would have to be built in a context with no source in it. Measured, with
# `uv sync` in that context:
#
#   flat layout, as before          -> succeeds, installing an EMPTY `districore` wheel
#   packages.find where=["backend"] -> fails: egg_base option: 'backend' does not exist
#   package = false                 -> installs dependencies, and nothing else
#
# It does not block future internal packages. A non-package root with
# `[tool.uv.workspace] members = [...]` is the recommended uv workspace layout, and each
# member carries its own manifest and its own name instead of the root claiming `core` and
# `orders` for itself. Reversing this is one deleted line.
#
# Full reasoning, including the hypothesis this replaced:
# docs/TD-21_Reproducible_Build_Note.md §1.7-§1.8.
package = false

# --- transitive floors (M10.5) ----------------------------------------------
#
# `sqlparse` arrives through Django, which requires only `>=0.3.1`. Raising Django to 5.2.17
# therefore did **not** raise sqlparse: `uv lock` keeps a locked version while the constraints
# still permit it — correct, minimal churn, and it left 0.5.5 with five advisories in the lock
# while three documents said they were fixed. `make verify` could not catch it, because the
# dependency audit is `make audit` and a CI step, not one of the eight stages.
#
# A constraint rather than a dependency: nothing here imports sqlparse, and
# `[project.dependencies]` is governed — *"adding one without an ADR is a review failure"*.
# A constraint says "if it is resolved at all, not below this", which is the accurate claim.
#
# Fixes PYSEC-2026-3696/3697/3698/3699 and CVE-2026-84305. Django 5.2 permits it.
constraint-dependencies = ["sqlparse>=0.6.0"]

# ---------------------------------------------------------------------------
# ruff — linter and formatter in one (00 §6.3)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "S",        # bandit — security
    "C4",       # comprehensions
    "DJ",       # flake8-django
    "UP",       # pyupgrade
    "RUF",
]
ignore = [
    "S101",  # assert — used by pytest
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S105", "S106", "S311"]
"backend/config/settings/*" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["core", "identity", "api", "webadmin", "config"]

# ---------------------------------------------------------------------------
# mypy — strict on the service and selector layer (00 §6.3)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
mypy_path = "backend"
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ['migrations/', 'backend/tests/']

[[tool.mypy.overrides]]
module = ["*.services", "*.selectors"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true

# Third-party packages that ship no py.typed marker and no stubs we depend on.
# Not type errors — absence of type information. djangorestframework-stubs exists but
# pins mypy and django-stubs versions tightly; adopting it is an M3 decision, recorded
# in docs/M0_Completion_Report.md §5. Everything WE write is still checked.
[[tool.mypy.overrides]]
module = [
    "axes.*", "environ.*", "factory.*",
    "rest_framework.*", "rest_framework_simplejwt.*",
    "sentry_sdk.*", "weasyprint.*", "whitenoise.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ---------------------------------------------------------------------------
# pytest (00 §6.4)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
# --ds beats DJANGO_SETTINGS_MODULE from the environment. Without it, compose.dev.yml
# exports config.settings.dev and the suite silently runs against DEV settings —
# real throttles, real SMS provider, Argon2 hashing. That was the root cause of the
# first test-stage failure, not the throttle string itself.
addopts = "--strict-markers --disable-warnings --ds=config.settings.test"
markers = [
    "adversarial: deliberately abusive tests for requirements ordinary tests cannot verify (02 §25.2)",
]

[tool.coverage.run]
source = ["backend"]
omit = ["*/migrations/*", "*/tests/*", "*/config/*", "*/wsgi.py", "*/manage.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

# ---------------------------------------------------------------------------
# import-linter — makes N-01 and N-02 mechanically enforceable (00 §6.3)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = [
    "core", "identity", "catalogue", "customers", "inventory", "ledger",
    "pricing", "orders", "purchasing", "fulfilment", "field", "billing",
    "receivables", "reporting", "sync", "api", "webadmin",
]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "N-01/N-02: delivery layers must not touch models directly"
type = "forbidden"
source_modules = ["api", "webadmin"]
forbidden_modules = [
    "core.models", "identity.models",
    "catalogue.models", "customers.models", "inventory.models",
    "ledger.models", "pricing.models", "orders.models",
    "purchasing.models",
    "fulfilment.models", "billing.models", "receivables.models",
    "field.models", "sync.models",
]
# Direct imports only: reaching models THROUGH a service is the required path.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "N-01: domain modules must not import a delivery layer"
type = "forbidden"
source_modules = [
    "core", "identity", "catalogue", "customers", "inventory", "ledger",
    "pricing", "orders", "purchasing", "fulfilment", "field", "billing",
    "receivables", "reporting", "sync",
]
forbidden_modules = ["api", "webadmin"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "03 §2.1: module graph is layered and acyclic"
type = "layers"
# 03 §2.1: inventory may call catalogue (stock is stock OF a product).
# catalogue must never call inventory.
#
# ADR-0008 / M5-6: `ledger` is a SIBLING of `inventory`, not a member of `customers`.
# They are the two append-only fact tables over master data — stock over catalogue,
# money over customers — and neither imports the other:
#
#     catalogue -> Product   is to   inventory -> StockMovement
#     customers -> Customer  is to   ledger    -> CustomerLedgerEntry
#
# `billing` sits above `fulfilment` because an invoice is issued for a dispatch; both
# sit above `orders`.
#
# M6: `receivables` sits above `billing` for exactly one reason — the FIFO outstanding
# walk resolves a credit note to its invoice through `billing` (M6 §5A.10). It is a
# READ. A structural test asserts `receivables` never imports `billing.services`, the
# same read/write distinction the M5 boundary suite drew for `orders -> ledger`.
#
# M7: `reporting` sits at the top of the domain and below the delivery layers. It owns
# nothing — no models, no services, no migrations — and reads from every layer beneath
# it. Being highest is what makes that safe: nothing can depend on a report, so a report
# cannot become an input to a business rule. The same structural test asserts it imports
# no `*.services` and no `*.models` at all (M7 §8.1, M7-5).
#
# M9.1 (D-M9.1-2): `sync` is a SIBLING of `reporting`, and `field` a sibling of
# `fulfilment`.
#
#   sync -> field | fulfilment -> customers | identity | core
#
# `sync` sits at the top of the domain for the same reason `reporting` does: nothing may
# depend on it. It is driven by the API layer alone, coordinates dispatch into the domain
# and owns no business rule — a module that imported `sync` would be a business rule
# reaching up into a transport concern. Siblings cannot import each other, so `reporting`
# and `sync` stay independent.
#
# `field` (T-23 `visit`) is a sibling of `fulfilment` rather than a member of `customers`:
# a visit is an append-only OBSERVATION about a customer, the same relationship
# `stock_movement` has to `catalogue` and `customer_ledger_entry` has to `customers`
# (ADR-0008). It reads `customers` and `identity` and writes only its own table, and being
# a sibling of `fulfilment` means neither can reach into the other.
layers = [
    "api | webadmin",
    "reporting | sync",
    "receivables",
    "billing",
    "fulfilment | field",
    "orders | purchasing",
    "pricing",
    "inventory | ledger",
    "catalogue | customers",
    "identity",
    "core",
]
