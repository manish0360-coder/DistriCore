# Base compose — the invariant core. Overridden by compose.dev.yml / compose.prod.yml (FD-09).
name: districore

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-districore}
      POSTGRES_USER: ${POSTGRES_USER:-districore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - db_data:/var/lib/postgresql/data   # named volume, never a host bind (04 §8.2)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-districore} -d ${POSTGRES_DB:-districore}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/srv/media
      - backup_data:/srv/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

volumes:
  db_data:
  media_data:
  backup_data:
