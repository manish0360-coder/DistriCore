# Production overrides: immutable image, no source mount, TLS at the edge.
services:
  db:
    ports: []                       # never exposed outside the compose network

  app:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - media_data:/srv/media
      - backup_data:/srv/backups
      - static_data:/app/staticfiles
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      # **The certificate identity, and production never supplied it.**
      #
      # `docker/Caddyfile` is parameterised as `{$DISTRICORE_DOMAIN:localhost}` and
      # `compose.dev.yml` sets it to the emulator's host alias, noting that "production
      # supplies the real domain". This overlay did not. With the variable unset Caddy fell
      # back to `localhost`, selected its **internal** issuer, and served a certificate no
      # browser trusts — for a domain (A-04) that had been bought and pointed at the host.
      # Nothing would have failed loudly; TLS would simply have been wrong.
      #
      # `:?` rather than a default, for the reason `POSTGRES_PASSWORD` carries one in
      # `compose.yml`: the value cannot be guessed, and a wrong guess is worse than a
      # refusal. A deploy without a domain now stops at interpolation.
      DISTRICORE_DOMAIN: ${DISTRICORE_DOMAIN:?DISTRICORE_DOMAIN is required — Caddy cannot obtain a certificate for a name it has not been given}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  static_data:
  caddy_data:
  caddy_config:
