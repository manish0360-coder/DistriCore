# Development overrides: source mounted for live reload, database reachable from the host.
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"   # loopback only — never 0.0.0.0

  app:
    build:
      target: dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DISTRICORE_COLLECTSTATIC: "false"
    volumes:
      - ../backend:/app/backend      # live edit (FD-09)
      - ../pyproject.toml:/app/pyproject.toml:ro  # ruff / pytest / import-linter config
      # M10.5. `uv.lock` is COPYed into the **builder** stage at `/build`, never into the
      # runtime one — so `/app/uv.lock` does not exist without this line, and
      # `test_the_lock_contains_the_versions_the_security_review_claims` cannot read the
      # thing it is about. Read-only: the lock is regenerated by `uv lock` on the host, and
      # a container that could write to it would be a second author.
      - ../uv.lock:/app/uv.lock:ro
      - ../ops:/app/ops:ro
      # M8 task 1. `test_mobile_boundary.py` reads the Dart sources, the Makefile and the
      # toolchain Dockerfile from inside stage 7 — the mobile contracts are blocking
      # because they run in the gate, and they cannot run against files the container
      # cannot see. Read-only: nothing in the backend image may write to these.
      #
      # **This list and `REQUIRED_PATHS` in that test module are one fact in two places.**
      # `docker/` was added here a commit after the test that reads it, and stage 7 failed
      # on a `FileNotFoundError` rather than on anything about the mobile code. The test
      # module now checks its own preconditions first and names this block in the message.
      - ../mobile:/app/mobile:ro
      - ../Makefile:/app/Makefile:ro
      - ../docker:/app/docker:ro
      # `scripts/win-flutter.sh` is not merely read by the mobile contracts, it is
      # EXECUTED by them against a stubbed `wslpath` — the corruption it guards happens
      # downstream of make and no static check can see it. Read-only still: the test
      # runs it, it does not edit it.
      - ../scripts:/app/scripts:ro
      # M10. `test_security_nfrs.py` asserts three repository-level contracts from inside
      # stage 7, for the same reason the mobile contracts are there: `make verify` is the
      # only authority (N-12), and a security contract enforced somewhere it cannot see is
      # advisory. Read-only, and each is a file the backend never touches at runtime:
      #
      #   .github     NFR-SEC-009 — the audit step must carry no `|| true` (TD-35)
      #   docs        the M10 review must account for all eleven requirements
      #   .gitignore  NFR-SEC-007 — `.env` must be uncommittable
      #
      # **This block and `REQUIRED_PATHS` in that module are one fact in two places**, which
      # is exactly what the note above warns about — and the M10 suite was written before
      # these three lines, so its first authoritative run failed on the missing mounts
      # rather than on anything about security. Its precondition test now names this block.
      - ../.github:/app/.github:ro
      - ../docs:/app/docs:ro
      - ../.gitignore:/app/.gitignore:ro
      - media_data:/srv/media
      - backup_data:/srv/backups
    ports:
      - "127.0.0.1:8000:8000"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  # --- development TLS terminator ------------------------------------------
  #
  # **`00` §7.1 already draws this.** Its local-development diagram shows
  # `caddy :80/:443 → app`, and until now only `compose.prod.yml` had it — so the
  # documented shape and the running stack disagreed. The disagreement was invisible
  # until an Android build existed, because a browser is happy on `localhost:8000`.
  #
  # **Why the app forces the issue.** `lib/app/config.dart` refuses any `http://` base
  # URL, citing `00` §9's TLS termination and `02A` §9.3, and its test calls an `http://`
  # value *"the single most damaging value that would otherwise work: every request
  # succeeds, in clear text, carrying a bearer token."* That rule is right. The emulator
  # therefore needs a real TLS endpoint, not an exemption.
  #
  # **The Caddyfile is not duplicated and not modified.** `docker/Caddyfile` is already
  # parameterised as `{$DISTRICORE_DOMAIN:localhost}`; dev supplies the emulator's host
  # alias, production supplies the real domain. One file, two identities.
  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      # **The certificate identity, and it must match the URL the app is built with.**
      # A cert's SANs are fixed at issue, so Caddy's default `localhost` certificate is
      # *not* valid for 10.0.2.2 — the emulator's alias for the host loopback (`00` §7.3).
      # Caddy selects its **internal** issuer for an IP literal, never ACME: no public CA,
      # no internet dependency, no name that has to exist in DNS.
      DISTRICORE_DOMAIN: "10.0.2.2"
    ports:
      # Loopback only, exactly like `app` and `db` above — never 0.0.0.0. WSL2 forwards
      # host loopback to Windows, which is the same path `10.0.2.2:8000` already uses.
      # If :443 is taken on Windows, change to "127.0.0.1:8443:443" and build the app
      # with https://10.0.2.2:8443 — `AppConfig` accepts an explicit port.
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media_data:/srv/media:ro
      # **`caddy_data` holds the internal CA and must persist.** Deleting it regenerates
      # the root, which silently invalidates the certificate already installed in the
      # emulator's trust store — the failure looks like a broken app, not a wiped volume.
      # `make clean` removes volumes; re-run `make emulator-trust-ca` after one.
      - caddy_data_dev:/data
      - caddy_config_dev:/config

volumes:
  caddy_data_dev:
  caddy_config_dev:
