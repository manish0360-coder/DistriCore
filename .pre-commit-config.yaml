# Runs before a commit exists. The first of three secret-scanning layers (00 §2.5).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.19.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: conventional-commit
        name: Conventional Commit message (00 §6.2)
        language: pygrep
        entry: '^(feat|fix|docs|refactor|test|chore|perf|build|ci)(\([a-z0-9\-]+\))?!?: .{1,72}'
        args: ["--negate"]
        stages: [commit-msg]
